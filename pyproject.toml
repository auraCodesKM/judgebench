[project]
name = "judgebench"
version = "0.1.0"
description = "Evidence-backed evaluation for AI hackathon submissions"
requires-python = ">=3.12,<3.13"
# Base deps are all the probe service gets: smallest possible surface.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic[email]>=2.8",
]

[project.optional-dependencies]
# Everything except the probe: DB, Google, GitHub, Telegram.
app = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pyyaml>=6",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "google-adk>=2.14",
]

[project.scripts]
judgebench = "judgebench.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501"]  # asserts ok; formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["judgebench"]
mypy_path = "src"
plugins = []

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*", "google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["judgebench.google.workspace", "judgebench.pubsub", "judgebench.cli.doctor"]
disallow_untyped_calls = false  # google-auth ships partial types

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs Postgres (docker compose up -d db)",
]
xfail_strict = true
