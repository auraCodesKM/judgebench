# Form answers for the demo cast, in submission order (Beta first). Claims live in each README;
# the Form lists stack and data only (no duplicated claims). Team codes come from the demo
# event file (events/<slug>.yaml, gitignored), in this order. Used for DEMO_FORM_ANSWERS.md and rehearsals.
- team_name: Team Beta
  team_members: "Priya S., Arjun M. (synthetic demo team)"
  project_title: InsightRAG
  problem_statement: Support agents waste minutes searching policy documents for refund and shipping rules. InsightRAG answers customer-policy questions instantly from your documents.
  categories: ["LLM / RAG"]
  repo_url: https://github.com/auraCodesKM/team-beta-insight
  setup_instructions: "pip install -r requirements.txt && uvicorn app:app, then POST /ask {\"q\": \"...\"}"
  deployed_url: https://team-beta-insight.vercel.app
  tech_claims: Python, FastAPI, LangChain, Chroma vector store, OpenAI embeddings
  dataset_eval: Internal FAQ documents
  special_requirements: None
  sample_request: '{"method": "POST", "path": "/ask", "body": {"q": "how long do refunds take"}, "expect": ["answer"]}'
- team_name: Team Alpha
  team_members: "Meera K., Rohan T. (synthetic demo team)"
  project_title: Orbit DocQA
  problem_statement: Router support teams answer the same questions all day from a 40-page manual. Orbit DocQA returns the exact manual passage that answers a question, with its source section.
  categories: ["LLM / RAG"]
  repo_url: https://github.com/auraCodesKM/team-alpha-docqa
  setup_instructions: "pip install -r requirements.txt && uvicorn app.main:app; pytest -q; python -m eval.eval_retrieval"
  deployed_url: https://team-alpha-docqa.vercel.app
  tech_claims: Python, FastAPI, BM25 retrieval written from scratch, pytest, GitHub Actions
  dataset_eval: Router manual (6 sections); held-out questions in eval/qa.jsonl
  special_requirements: None
  sample_request: '{"method": "POST", "path": "/ask", "body": {"q": "how do I factory reset"}, "expect": ["sources"]}'
- team_name: Team Gamma
  team_members: "Kabir R., Ananya P. (synthetic demo team)"
  project_title: TripPlanner
  problem_statement: Planning a short trip means juggling distances, budgets and day plans. TripPlanner uses a researcher agent with tools and a writer agent to produce an itinerary.
  categories: ["Agentic AI"]
  repo_url: https://github.com/auraCodesKM/team-gamma-planner
  setup_instructions: "pip install -r requirements.txt; pytest -q (no key needed); OPENAI_API_KEY=... python graph.py"
  tech_claims: Python, LangGraph, LangChain, OpenAI gpt-4o-mini, pytest, GitHub Actions
  dataset_eval: None
  special_requirements: OPENAI_API_KEY to run the agents (not needed for tests)
- team_name: Team Delta
  team_members: "Ishaan V., Neha G. (synthetic demo team)"
  project_title: CropScan
  problem_statement: Smallholder farmers lose crops to leaf diseases they can't identify early. CropScan classifies a leaf photo with a fine-tuned ViT and writes advice with GPT-4o vision.
  categories: ["Computer vision / multimodal", "Traditional ML"]
  repo_url: https://github.com/auraCodesKM/team-delta-vision
  setup_instructions: "pip install -r requirements.txt; python train.py (GPU); OPENAI_API_KEY=... python advise.py leaf.jpg"
  tech_claims: PyTorch, Hugging Face ViT (google/vit-base-patch16-224), OpenAI GPT-4o vision
  dataset_eval: PlantVillage (2.1 GB, not included)
  special_requirements: NVIDIA GPU with 24 GB VRAM (CUDA 12), OPENAI_API_KEY, PlantVillage dataset
- team_name: Team Epsilon
  team_members: "Dev A., Sara L. (synthetic demo team)"
  project_title: NoteGenie
  problem_statement: Students re-read notes instead of testing themselves. NoteGenie turns lecture notes into flashcards.
  categories: ["LLM / RAG"]
  repo_url: https://github.com/auraCodesKM/team-epsilon-notes
  setup_instructions: python notes.py lecture.txt
  tech_claims: Python
  dataset_eval: None
  special_requirements: None
- team_name: Team Zeta
  team_members: "Vikram N., Tara J. (synthetic demo team)"
  project_title: StudyBuddy
  problem_statement: Students get stuck on homework late at night. StudyBuddy is an AI study assistant that answers questions in plain language.
  categories: ["LLM / RAG"]
  repo_url: https://github.com/auraCodesKM/team-zeta-assistant
  setup_instructions: "pip install -r requirements.txt; OPENAI_API_KEY=... python main.py"
  tech_claims: Python, OpenAI gpt-4o-mini, GitHub Actions
  dataset_eval: None
  special_requirements: OPENAI_API_KEY
